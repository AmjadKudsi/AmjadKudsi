<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title>Amjad Kudsi on LinkedIn</title>
<style>
.lp-page{display:none}
@media (min-height:120px){.lp-badge{display:none}.lp-page{display:inline}}
.lp-bg{fill:#f6f8fa}
.lp-card{fill:#fff;stroke:#d1d9e0}
.lp-title{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:20px;font-weight:600}
.lp-url{fill:#59636e;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.lp-icon{fill:none;stroke:#59636e;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.lp-btn{fill:#1f2328;transition:fill .15s ease}
.lp-btn-text{fill:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600}
.lp-note{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px}
.lp-link{cursor:pointer;outline:none}
.lp-link:hover .lp-btn{fill:#393f46}
.lp-link:focus-visible .lp-card{stroke:#0969da;stroke-width:2}
.lp-enter{animation:lp-in .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes lp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:460px){.lp-fit{transform:scale(.9)}}
@media (max-width:400px){.lp-fit{transform:scale(.84)}}
@media (max-width:360px){.lp-fit{transform:scale(.78)}}
@media (max-width:330px),(max-height:300px){.lp-fit{transform:scale(.72)}}
@media (max-device-width:500px) and (min-width:700px) and (orientation:portrait){.lp-fit{transform:scale(2.2)}}
.lp-link{-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){
.lp-bg{fill:#010409}
.lp-card{fill:#0d1117;stroke:#3d444d;filter:none}
.lp-title{fill:#f0f6fc}
.lp-url,.lp-note{fill:#9198a1}
.lp-icon{stroke:#9198a1}
.lp-btn{fill:#f0f6fc}
.lp-btn-text{fill:#0d1117}
.lp-link:hover .lp-btn{fill:#d1d9e0}
.lp-link:focus-visible .lp-card{stroke:#4493f8}
}
@media (prefers-reduced-motion:reduce){.lp-enter{animation:none}}
</style>
<defs>
<symbol id="lp-badge" viewBox="0 0 75 20"><filter id="b-blur"><feGaussianBlur stdDeviation="16"/></filter><linearGradient id="b-s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="b-r"><rect width="75" height="20" rx="3"/></clipPath><g clip-path="url(#b-r)"><rect width="0" height="20" fill="#555"/><rect x="0" width="75" height="20" fill="#0077b5"/><rect width="75" height="20" fill="url(#b-s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><svg viewBox="0 0 16 16" x="5" y="3" width="14" height="14"><path fill="#fff" d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/></svg><g transform="scale(.1)"><g aria-hidden="true" fill="#010101"><text x="465" y="150" fill-opacity=".8" filter="url(#b-blur)" textLength="470">LinkedIn</text><text x="465" y="150" fill-opacity=".3" textLength="470">LinkedIn</text></g><text x="465" y="140" textLength="470">LinkedIn</text></g></g></symbol>
<filter id="lp-lift" x="-20%" y="-20%" width="140%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
<feOffset dy="8" result="blur"/>
<feFlood flood-color="#1f2328" flood-opacity=".09"/>
<feComposite in2="blur" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<use class="lp-badge" href="#lp-badge" xlink:href="#lp-badge" width="100%" height="100%"/>
<g class="lp-page">
<rect class="lp-bg" width="100%" height="100%"/>
<svg x="50%" y="50%" overflow="visible">
<g class="lp-fit"><g class="lp-enter">
<a class="lp-link" href="https://linkedin.com/in/amjadkudsi" xlink:href="https://linkedin.com/in/amjadkudsi" aria-label="Continue to LinkedIn: linkedin.com/in/amjadkudsi">
<g transform="translate(-200 -111)">
<rect class="lp-card" x=".5" y=".5" width="399" height="221" rx="12" filter="url(#lp-lift)"/>
<use href="#lp-badge" xlink:href="#lp-badge" x="28" y="28" width="75" height="20"/>
<text class="lp-title" x="28" y="86">Amjad Kudsi on LinkedIn</text>
<path class="lp-icon" transform="translate(28 99)" d="M5 1.5H2.5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V7M7.5 1.5h3v3M10.5 1.5 5.5 6.5"/>
<text class="lp-url" x="47" y="110">linkedin.com/in/amjadkudsi</text>
<rect class="lp-btn" x="28" y="134" width="344" height="40" rx="6"/>
<text class="lp-btn-text" x="200" y="159" text-anchor="middle">Continue to LinkedIn</text>
<text class="lp-note" x="200" y="200" text-anchor="middle">Your GitHub tab is still open.</text>
</g>
</a>
</g></g>
</svg>
</g>
</svg>
